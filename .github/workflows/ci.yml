name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer, rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked real_rust_analyzer -- --ignored
      - run: cargo build --locked --release
      - if: runner.os != 'Windows'
        run: python3 scripts/smoke_tui.py target/release/reditor
      - if: runner.os != 'Windows'
        run: python3 scripts/smoke_studio.py target/release/reditor
  mermaid:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtime/mermaid/.browsers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/mermaid/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: runtime/mermaid
      - run: npx playwright install --with-deps chromium
        working-directory: runtime/mermaid
      - run: npm test
        working-directory: runtime/mermaid
      - run: cargo build --locked --release
      - run: python3 scripts/smoke_tui.py target/release/reditor --mermaid

  remote-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/formatter/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y php-cli curl
      - run: npm ci
        working-directory: runtime/formatter
      - run: mkdir -p "$HOME/.reditor/tools" && curl -fsSL https://cs.symfony.com/download/php-cs-fixer-v3.phar -o "$HOME/.reditor/tools/php-cs-fixer.phar"
      - run: python -m pip install pyftpdlib paramiko pyopenssl
      - run: python scripts/smoke_remote.py
      - run: cargo test --locked real_php_lua -- --ignored
      - run: cargo test --locked real_multilanguage_formatters -- --ignored
